aid: synthace
name: Synthace
description: >-
  Synthace is a London-headquartered life-science software company (offices in London, Boston
  and San Diego) behind Antha, a cloud digital-experiment platform for R&D teams. The platform
  lets biologists design multifactorial Design of Experiments (DOE) and Quality by Design (QbD)
  studies, simulate them ahead of time, compile them into machine-executable protocols that run
  on third-party lab automation hardware (Tecan, Formulatrix, SPT Labtech and others), and
  capture the resulting experimental data and metadata in a single structured, AI-ready record.
  Synthace is delivered as an authenticated tenant application at antha.com rather than as a
  developer product - as of 2026-08-29 the company publishes no developer portal, no API
  reference, no SDKs and no machine-readable contract on any public host, and the platform's
  own /api/* surface answers every unauthenticated request with a blanket JSON 401.
